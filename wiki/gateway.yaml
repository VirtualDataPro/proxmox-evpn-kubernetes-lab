# Reader walkthrough: isolated namespace/Gateway. Reserve this address first.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: wiki-guide
spec:
  blocks:
    - start: 10.60.10.210
      stop: 10.60.10.210
  serviceSelector:
    matchLabels:
      io.cilium.gateway/owning-gateway: wiki-guide
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: wiki-guide
spec:
  interfaces: ['^eth0$']
  loadBalancerIPs: true
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/worker: ''
  serviceSelector:
    matchLabels:
      io.cilium.gateway/owning-gateway: wiki-guide
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: wiki-guide
  namespace: lab-wiki
spec:
  gatewayClassName: cilium
  listeners:
    - name: wiki-tls
      hostname: wiki.demo.test
      port: 443
      protocol: TLS
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Same
    - name: wiki-http
      hostname: wiki.demo.test
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: wiki-guide
  namespace: lab-wiki
spec:
  parentRefs:
    - name: wiki-guide
      sectionName: wiki-tls
  hostnames: [wiki.demo.test]
  rules:
    - backendRefs:
        - name: lab-wiki
          port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wiki-guide-redirect
  namespace: lab-wiki
spec:
  parentRefs:
    - name: wiki-guide
      sectionName: wiki-http
  hostnames: [wiki.demo.test]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
