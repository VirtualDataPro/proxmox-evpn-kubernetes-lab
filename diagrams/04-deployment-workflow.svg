<polyline points="1030,250 1080,250" fill="none" stroke="#526975" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1310,320 1310,435" fill="none" stroke="#526975" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1080,505 1030,505" fill="none" stroke="#526975" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="570,505 520,505" fill="none" stroke="#526975" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="290,575 290,690" fill="none" stroke="#526975" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="520,760 570,760" fill="none" stroke="#526975" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1080" y="690" width="460" height="140" rx="12" fill="white" stroke="#a56420" stroke-width="2"/>
<text x="1098" y="722" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#a56420" font-weight="700" text-anchor="start">Then protect and operate</text>
<text x="1098" y="754" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">Current backups / restore drills</text>
<text x="1098" y="782" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">Maintenance and monitoring</text>
<polyline points="1030,760 1080,760" fill="none" stroke="#526975" stroke-width="3" marker-end="url(#arrow)"/>
<text x="60" y="965" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#526975" font-weight="400" text-anchor="start">Retain configuration after each checkpoint. Back up stateful data separately from application manifests.</text>
<text x="60" y="992" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#526975" font-weight="400" text-anchor="start">Bootstrap/wiki code was lab-tested; public address and hostname substitutions require your own validation.</text>
</svg>