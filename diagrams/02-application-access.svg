<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#526975"/></marker></defs>
<rect width="1600" height="1050" fill="#f6f9fb"/>
<text x="60" y="62" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#152d37" font-weight="700" text-anchor="start">How clients reach the websites</text>
<text x="60" y="103" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#526975" font-weight="400" text-anchor="start">DNS selects the shared VIP • Cilium routes by hostname/SNI • TLS ownership differs by application</text>
<rect x="60" y="170" width="410" height="120" rx="12" fill="white" stroke="#286ca6" stroke-width="2"/>
<text x="78" y="202" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#286ca6" font-weight="700" text-anchor="start">Client</text>
<text x="78" y="234" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">LAN / laptop / VPN</text>
<text x="78" y="262" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">Uses Upstream router-backed lab DNS</text>
<rect x="590" y="170" width="450" height="120" rx="12" fill="white" stroke="#286ca6" stroke-width="2"/>
<text x="608" y="202" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#286ca6" font-weight="700" text-anchor="start">DNS lookup</text>
<text x="608" y="234" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">wiki.demo.home.arpa and site.demo.home.arpa</text>
<text x="608" y="262" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">Both return 10.60.10.100</text>
<polyline points="470,230 590,230" fill="none" stroke="#526975" stroke-width="3" marker-end="url(#arrow)"/>
<text x="477" y="209" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#526975" font-weight="400" text-anchor="start">Resolve name</text>
<rect x="60" y="400" width="410" height="120" rx="12" fill="white" stroke="#286ca6" stroke-width="2"/>
<text x="78" y="432" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#286ca6" font-weight="700" text-anchor="start">Upstream router → hv-a</text>
<text x="78" y="464" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">10.60.10.0/24 routed via</text>
<text x="78" y="492" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">192.0.2.11 → EVPN</text>
<polyline points="265,290 265,400" fill="none" stroke="#526975" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="590" y="400" width="450" height="120" rx="12" fill="white" stroke="#147d64" stroke-width="2"/>
<text x="608" y="432" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#147d64" font-weight="700" text-anchor="start">Shared VIP • 10.60.10.100</text>
<text x="608" y="464" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">One elected worker announces ARP</text>
<text x="608" y="492" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">Gateway Service → Cilium Envoy</text>
<polyline points="470,460 590,460" fill="none" stroke="#526975" stroke-width="3" marker-end="url(#arrow)"/>
<text x="484" y="438" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#526975" font-weight="400" text-anchor="start">TCP 443</text>
<rect x="1130" y="290" width="410" height="170" rx="12" fill="white" stroke="#147d64" stroke-width="2"/>
<text x="1148" y="322" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#147d64" font-weight="700" text-anchor="start">Wiki • lab-wiki</text>
<text x="1148" y="354" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">TLSRoute selects wiki SNI</text>
<text x="1148" y="382" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">TLS passthrough → Nginx :443</text>
<text x="1148" y="410" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">2 replicas across physical hosts</text>
<rect x="1130" y="575" width="410" height="170" rx="12" fill="white" stroke="#147d64" stroke-width="2"/>
<text x="1148" y="607" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#147d64" font-weight="700" text-anchor="start">Example site • example-site</text>
<text x="1148" y="639" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">TLS terminates at Cilium</text>
<text x="1148" y="667" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">HTTPRoute → site-web :80</text>
<text x="1148" y="695" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">3 web replicas → NAS NFS</text>
<polyline points="1040,460 1080,460 1080,375 1130,375" fill="none" stroke="#526975" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1040,460 1080,460 1080,660 1130,660" fill="none" stroke="#526975" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="590" y="730" width="450" height="120" rx="12" fill="white" stroke="#a56420" stroke-width="2"/>
<text x="608" y="762" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#a56420" font-weight="700" text-anchor="start">Control plane • cp-a</text>
<text x="608" y="794" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">Kubernetes Lease supports elections</text>
<text x="608" y="822" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">API needed for ownership changes</text>
<polyline points="815,730 815,520" fill="none" stroke="#526975" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 7"/>
<text x="60" y="985" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#526975" font-weight="400" text-anchor="start">HTTPS source policy permits the documented management LAN, laptop LAN, and VPN; HTTP redirects to HTTPS.</text>
<text x="60" y="1012" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#526975" font-weight="400" text-anchor="start">Measured worker failover: lease acquired ~22 s; both sites recovered by ~38 s. This does not prove physical-host HA.</text>
</svg>