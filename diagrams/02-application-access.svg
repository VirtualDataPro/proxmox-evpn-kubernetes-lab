<text x="760" y="699" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Certificate at Cilium · HTTPRoute selects backend</text>
<text x="760" y="730" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">ledger-web Service :80 → web pods</text>
