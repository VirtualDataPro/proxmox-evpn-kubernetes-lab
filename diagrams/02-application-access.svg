<polyline points="865,528 865,576 1043,576 1043,626" fill="none" stroke="#536a76" stroke-width="3" marker-end="url(#arr)"/>
<text x="700" y="867" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="700" fill="#9b6225" text-anchor="middle">cp1 API supports Lease elections  ·  externalTrafficPolicy: Cluster</text>
<text x="700" y="910" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#536a76" text-anchor="middle">HTTP redirects to HTTPS. Gateway source policy permits the intended LAN / VPN ranges.</text>
<path d="M52 979H1348" stroke="#d5dfdf" stroke-width="2"/>
<text x="52" y="1015" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#536a76" text-anchor="start">Worker-pause test: new holder observed at 22.1 s; both HTTPS sites returned 200 by 38 s.</text>
<text x="52" y="1045" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#536a76" text-anchor="start">A new announcer does not remove Firewalla’s fixed upstream next hop through pve1.</text>
