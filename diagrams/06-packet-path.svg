<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1030" viewBox="0 0 1400 1030" role="img">
<title>Follow one cross-host pod packet</title><desc>Same Kubernetes VNet, two physical hosts. Proxmox supplies the VXLAN crossing.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536a76"/></marker></defs>
<rect width="1400" height="1030" fill="#f7f9f7"/>
<text x="52" y="48" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#087e80" text-anchor="start">PROXMOX LAB  /  PART 2</text>
<text x="1348" y="48" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#087e80" text-anchor="end">06</text>
<text x="52" y="104" font-family="DejaVu Sans,sans-serif" font-size="39" font-weight="700" fill="#142f3d" text-anchor="start">Follow one cross-host pod packet</text>
<text x="52" y="145" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#536a76" text-anchor="start">Same Kubernetes VNet, two physical hosts. Proxmox supplies the VXLAN crossing.</text>
<rect x="52" y="201" width="610" height="514" rx="16" fill="#edf2f3" stroke="#d5dfdf" stroke-width="2"/>
<text x="76" y="241" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#2a62a2" text-anchor="start">Source: worker1 on pve1</text>
<rect x="738" y="201" width="610" height="514" rx="16" fill="#edf2f3" stroke="#d5dfdf" stroke-width="2"/>
<text x="762" y="241" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="700" fill="#2a62a2" text-anchor="start">Destination: worker2 on pve2</text>
<rect x="76" y="270" width="562" height="112" rx="10" fill="white" stroke="#d5dfdf" stroke-width="2"/><rect x="76" y="282" width="5" height="88" rx="2" fill="#087e80"/>
<text x="98" y="307" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#087e80" text-anchor="start">Source pod</text>
<text x="98" y="343" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Pod range on worker1: 10.244.3.0/24</text>
<rect x="762" y="270" width="562" height="112" rx="10" fill="white" stroke="#d5dfdf" stroke-width="2"/><rect x="762" y="282" width="5" height="88" rx="2" fill="#087e80"/>
<text x="784" y="307" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#087e80" text-anchor="start">Destination pod</text>
<text x="784" y="343" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Pod range on worker2: 10.244.2.0/24</text>
<rect x="76" y="433" width="562" height="112" rx="10" fill="white" stroke="#d5dfdf" stroke-width="2"/><rect x="76" y="445" width="5" height="88" rx="2" fill="#087e80"/>
<text x="98" y="470" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#087e80" text-anchor="start">Cilium native routing</text>
<text x="98" y="506" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Node 10.50.10.12 → peer 10.50.10.13</text>
<rect x="762" y="433" width="562" height="112" rx="10" fill="white" stroke="#d5dfdf" stroke-width="2"/><rect x="762" y="445" width="5" height="88" rx="2" fill="#087e80"/>
<text x="784" y="470" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#087e80" text-anchor="start">Cilium / Linux routing</text>
<text x="784" y="506" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Node 10.50.10.13 → local destination pod</text>
<rect x="76" y="596" width="562" height="89" rx="10" fill="white" stroke="#d5dfdf" stroke-width="2"/><rect x="76" y="608" width="5" height="65" rx="2" fill="#2a62a2"/>
<text x="98" y="633" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#2a62a2" text-anchor="start">Proxmox VNet: evpntest</text>
<rect x="762" y="596" width="562" height="89" rx="10" fill="white" stroke="#d5dfdf" stroke-width="2"/><rect x="762" y="608" width="5" height="65" rx="2" fill="#2a62a2"/>
<text x="784" y="633" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#2a62a2" text-anchor="start">Proxmox VNet: evpntest</text>
<polyline points="357,382 357,433" fill="none" stroke="#536a76" stroke-width="3" marker-end="url(#arr)"/>
<polyline points="357,545 357,596" fill="none" stroke="#536a76" stroke-width="3" marker-end="url(#arr)"/>
<polyline points="1043,596 1043,545" fill="none" stroke="#536a76" stroke-width="3" marker-end="url(#arr)"/>
<polyline points="1043,433 1043,382" fill="none" stroke="#536a76" stroke-width="3" marker-end="url(#arr)"/>
<rect x="253" y="775" width="894" height="112" rx="10" fill="white" stroke="#d5dfdf" stroke-width="2"/><rect x="253" y="787" width="5" height="88" rx="2" fill="#2a62a2"/>
<text x="275" y="812" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#2a62a2" text-anchor="start">VXLAN VNI 10002 over the direct cable</text>
<text x="275" y="848" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Outer IP: 10.0.0.1 → 10.0.0.2  ·  Underlay MTU 9000</text>
<polyline points="357,685 357,775" fill="none" stroke="#536a76" stroke-width="3" marker-end="url(#arr)"/>
<polyline points="1043,775 1043,685" fill="none" stroke="#536a76" stroke-width="3" marker-end="url(#arr)"/>
<path d="M52 939H1348" stroke="#d5dfdf" stroke-width="2"/>
<text x="52" y="975" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#536a76" text-anchor="start">Guest / pod MTU 1500. Cilium adds no second VXLAN tunnel in the deployed native-routing mode.</text>
<text x="52" y="1005" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#536a76" text-anchor="start">The BGP EVPN session distributes reachability; the application’s data crosses the cable in VXLAN packets.</text>
</svg>