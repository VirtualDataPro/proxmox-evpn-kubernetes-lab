<text x="176" y="535" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#2a62a2" text-anchor="start">Move the network gateway</text>
<text x="176" y="571" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Checkpoint: management routing and external DNS / HTTPS work.</text>
