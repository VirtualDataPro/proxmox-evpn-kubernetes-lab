<text x="176" y="384" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#2a62a2" text-anchor="start">Change the switch management address</text>
<text x="176" y="420" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Checkpoint: reach the switch on its new management address.</text>
