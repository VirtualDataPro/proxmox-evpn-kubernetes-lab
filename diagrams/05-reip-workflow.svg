<text x="176" y="686" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#2a62a2" text-anchor="start">Move NFS, Proxmox and other workloads</text>
<text x="176" y="722" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Proxmox nodes: manual changes, about one hour of work.</text>
