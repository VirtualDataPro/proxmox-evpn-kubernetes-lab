<rect x="154" y="800" width="1194" height="119" rx="10" fill="white" stroke="#d5dfdf" stroke-width="2"/><rect x="154" y="812" width="5" height="95" rx="2" fill="#2a62a2"/>
<text x="176" y="837" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#2a62a2" text-anchor="start">Update monitoring and remaining servers</text>
<text x="176" y="873" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Checkpoint: revise targets, DNS, storage references and inventory.</text>
<path d="M52 989H1348" stroke="#d5dfdf" stroke-width="2"/>
<text x="52" y="1025" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#536a76" text-anchor="start">Sequence from the author’s account. Checkpoints are guidance for repeating it, not recovered command history.</text>
<text x="52" y="1055" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#536a76" text-anchor="start">The one-hour estimate covers manual Proxmox re-IP work; it is not a measured service-outage duration.</text>
