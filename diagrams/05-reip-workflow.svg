<text x="176" y="233" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#2a62a2" text-anchor="start">Give RougarouOS a second NIC</text>
<text x="176" y="269" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Checkpoint: console access and the intended route are available.</text>
