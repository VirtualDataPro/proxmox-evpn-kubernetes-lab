<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="#526975"/></marker></defs>
<rect width="1600" height="1080" fill="#f6f9fb"/>
<text x="60" y="62" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#152d37" font-weight="700" text-anchor="start">DNS resolution and record ownership</text>
<text x="60" y="103" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#526975" font-weight="400" text-anchor="start">PowerDNS owns lab records • Unbound resolves • Upstream router integrates clients</text>
<rect x="60" y="160" width="420" height="130" rx="12" fill="white" stroke="#286ca6" stroke-width="2"/>
<text x="78" y="192" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#286ca6" font-weight="700" text-anchor="start">LAN / VPN client</text>
<text x="78" y="224" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">Queries Upstream router</text>
<text x="78" y="252" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">demo.home.arpa and reverse lookups</text>
<rect x="590" y="160" width="430" height="130" rx="12" fill="white" stroke="#286ca6" stroke-width="2"/>
<text x="608" y="192" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#286ca6" font-weight="700" text-anchor="start">Upstream router • 192.0.2.1</text>
<text x="608" y="224" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">Lab names → dns-a / dns-b</text>
<text x="608" y="252" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">Other names → external resolution</text>
<polyline points="480,225 590,225" fill="none" stroke="#526975" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="120" y="400" width="580" height="145" rx="12" fill="white" stroke="#147d64" stroke-width="2"/>
<text x="138" y="432" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#147d64" font-weight="700" text-anchor="start">dns-a • 10.60.20.53</text>
<text x="138" y="464" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">Unbound :53 → local PowerDNS :5300</text>
<text x="138" y="492" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">Writable authority; API on loopback :8081</text>
<rect x="900" y="400" width="580" height="145" rx="12" fill="white" stroke="#147d64" stroke-width="2"/>
<text x="918" y="432" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#147d64" font-weight="700" text-anchor="start">dns-b • 10.60.20.54</text>
<text x="918" y="464" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">Unbound :53 → local PowerDNS :5300</text>
<text x="918" y="492" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">Secondary authority; TSIG zone transfers</text>
<polyline points="730,290 730,345 410,345 410,400" fill="none" stroke="#526975" stroke-width="3" marker-end="url(#arrow)"/>
<text x="145" y="370" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#526975" font-weight="400" text-anchor="start">Lab queries</text>
<polyline points="880,290 880,345 1190,345 1190,400" fill="none" stroke="#526975" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="700,475 900,475" fill="none" stroke="#526975" stroke-width="3" marker-end="url(#arrow)"/>
<text x="709" y="449" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#526975" font-weight="400" text-anchor="start">Zone transfers</text>
<rect x="120" y="675" width="580" height="135" rx="12" fill="white" stroke="#286ca6" stroke-width="2"/>
<text x="138" y="707" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#286ca6" font-weight="700" text-anchor="start">Proxmox SDN DNS integration</text>
<text x="138" y="739" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">Each host tunnels localhost:18081 to API</text>
<text x="138" y="767" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">Registration depends on provisioning workflow</text>
<polyline points="410,675 410,545" fill="none" stroke="#526975" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="900" y="675" width="580" height="135" rx="12" fill="white" stroke="#286ca6" stroke-width="2"/>
<text x="918" y="707" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#286ca6" font-weight="700" text-anchor="start">Kubernetes CoreDNS • 10.112.0.10</text>
<text x="918" y="739" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">Internal Service names: cluster.local</text>
<text x="918" y="767" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#152d37" font-weight="400" text-anchor="start">No external-dns controller installed</text>
<text x="60" y="1015" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#526975" font-weight="400" text-anchor="start">Unbound sends external questions back to Upstream router. Keep Upstream router lab forwarding conditional to avoid a DNS loop.</text>
<text x="60" y="1042" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#526975" font-weight="400" text-anchor="start">Application A records are operator-managed. Forward only the two lab reverse prefixes, not the whole 10/8 tree.</text>
</svg>