<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1130" viewBox="0 0 1400 1130" role="img">
<title>Lab DNS, from client to authority</title><desc>Query routing, authoritative records, replication and Kubernetes Service discovery.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#536a76"/></marker></defs>
<rect width="1400" height="1130" fill="#f7f9f7"/>
<text x="52" y="48" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#087e80" text-anchor="start">PROXMOX LAB  /  PART 2</text>
<text x="1348" y="48" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#087e80" text-anchor="end">03</text>
<text x="52" y="104" font-family="DejaVu Sans,sans-serif" font-size="39" font-weight="700" fill="#142f3d" text-anchor="start">Lab DNS, from client to authority</text>
<text x="52" y="145" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#536a76" text-anchor="start">Query routing, authoritative records, replication and Kubernetes Service discovery.</text>
<rect x="52" y="200" width="500" height="124" rx="10" fill="white" stroke="#d5dfdf" stroke-width="2"/><rect x="52" y="212" width="5" height="100" rx="2" fill="#2a62a2"/>
<text x="74" y="237" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#2a62a2" text-anchor="start">LAN / VPN clients</text>
<text x="74" y="273" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Use Firewalla for lab resolution</text>
<text x="74" y="304" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Lab names and reverse /24 prefixes</text>
<rect x="738" y="200" width="610" height="124" rx="10" fill="white" stroke="#d5dfdf" stroke-width="2"/><rect x="738" y="212" width="5" height="100" rx="2" fill="#2a62a2"/>
<text x="760" y="237" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#2a62a2" text-anchor="start">Firewalla  /  172.27.85.1</text>
<text x="760" y="273" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Lab questions → dns1 and dns2</text>
<text x="760" y="304" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Public questions → configured external resolution</text>
<polyline points="552,262 738,262" fill="none" stroke="#536a76" stroke-width="3" marker-end="url(#arr)"/>
<rect x="52" y="435" width="610" height="178" rx="10" fill="white" stroke="#d5dfdf" stroke-width="2"/><rect x="52" y="447" width="5" height="154" rx="2" fill="#087e80"/>
<text x="74" y="472" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#087e80" text-anchor="start">dns1  /  10.50.20.53</text>
<text x="74" y="508" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Unbound :53 answers clients</text>
<text x="74" y="539" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Local lab questions → PowerDNS :5300</text>
<text x="74" y="570" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Writable primary; API on loopback :8081</text>
<rect x="738" y="435" width="610" height="178" rx="10" fill="white" stroke="#d5dfdf" stroke-width="2"/><rect x="738" y="447" width="5" height="154" rx="2" fill="#087e80"/>
<text x="760" y="472" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#087e80" text-anchor="start">dns2  /  10.50.20.54</text>
<text x="760" y="508" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Unbound :53 answers clients</text>
<text x="760" y="539" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Local lab questions → PowerDNS :5300</text>
<text x="760" y="570" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Secondary; receives signed zone transfers</text>
<polyline points="937,324 937,377 357,377 357,435" fill="none" stroke="#536a76" stroke-width="3" marker-end="url(#arr)"/>
<polyline points="1110,324 1110,435" fill="none" stroke="#536a76" stroke-width="3" marker-end="url(#arr)"/>
<text x="700" y="659" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" fill="#536a76" text-anchor="middle">Primary → secondary: signed transfers of lab.local and 10.in-addr.arpa</text>
<rect x="52" y="750" width="610" height="156" rx="10" fill="white" stroke="#d5dfdf" stroke-width="2"/><rect x="52" y="762" width="5" height="132" rx="2" fill="#2a62a2"/>
<text x="74" y="787" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#2a62a2" text-anchor="start">Proxmox SDN / IPAM</text>
<text x="74" y="823" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Host-local tunnel → dns1 management API</text>
<text x="74" y="854" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Registration depends on provisioning workflow</text>
<text x="74" y="885" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Static cloud-init alone does not publish a record</text>
<rect x="738" y="750" width="610" height="156" rx="10" fill="white" stroke="#d5dfdf" stroke-width="2"/><rect x="738" y="762" width="5" height="132" rx="2" fill="#2a62a2"/>
<text x="760" y="787" font-family="DejaVu Sans,sans-serif" font-size="25" font-weight="700" fill="#2a62a2" text-anchor="start">Kubernetes CoreDNS  /  10.96.0.10</text>
<text x="760" y="823" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Owns Service names under cluster.local</text>
<text x="760" y="854" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">Other queries use the internal resolver pair</text>
<text x="760" y="885" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="400" fill="#142f3d" text-anchor="start">No external-dns controller publishes lab names</text>
<polyline points="355,750 355,690 220,690 220,613" fill="none" stroke="#536a76" stroke-width="3" marker-end="url(#arr)" stroke-dasharray="9 7"/>
<polyline points="1045,750 1045,613" fill="none" stroke="#536a76" stroke-width="3" marker-end="url(#arr)" stroke-dasharray="9 7"/>
<path d="M52 1039H1348" stroke="#d5dfdf" stroke-width="2"/>
<text x="52" y="1075" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#536a76" text-anchor="start">Unbound’s public upstream is Firewalla. Keep Firewalla’s lab forwarding conditional to avoid a loop.</text>
<text x="52" y="1105" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#536a76" text-anchor="start">Forward reverse 20.50.10.in-addr.arpa and 10.50.10.in-addr.arpa; do not redirect the entire 10/8 tree.</text>
</svg>