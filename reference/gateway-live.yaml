# Audited 2026-09-28. Review live objects before applying; contains no Secrets.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
spec:
  gatewayClassName: cilium
  listeners:
  - allowedRoutes:
      namespaces:
        from: Same
    hostname: ledger.lab.local
    name: http
    port: 80
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            kubernetes.io/metadata.name: lab-wiki
    hostname: wiki.lab.local
    name: wiki-http
    port: 80
    protocol: HTTP
  - allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            kubernetes.io/metadata.name: lab-wiki
    hostname: wiki.lab.local
    name: wiki-https
    port: 443
    protocol: TLS
    tls:
      mode: Passthrough
  - allowedRoutes:
      namespaces:
        from: Same
    hostname: ledger.lab.local
    name: ledger-https
    port: 443
    protocol: HTTPS
    tls:
      certificateRefs:
      - group: ''
        kind: Secret
        name: ledger-tls
      mode: Terminate
metadata:
  name: ledger-private
  namespace: architects-ledger
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
spec:
  hostnames:
  - ledger.lab.local
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: ledger-private
    sectionName: ledger-https
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: ledger-web
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
metadata:
  name: ledger
  namespace: architects-ledger
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
spec:
  hostnames:
  - ledger.lab.local
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: ledger-private
    sectionName: http
  rules:
  - filters:
    - requestRedirect:
        port: 443
        scheme: https
        statusCode: 301
      type: RequestRedirect
    matches:
    - path:
        type: PathPrefix
        value: /
metadata:
  name: ledger-redirect
  namespace: architects-ledger
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
spec:
  hostnames:
  - wiki.lab.local
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: ledger-private
    namespace: architects-ledger
    sectionName: wiki-http
  rules:
  - filters:
    - requestRedirect:
        port: 443
        scheme: https
        statusCode: 301
      type: RequestRedirect
    matches:
    - path:
        type: PathPrefix
        value: /
metadata:
  name: wiki-redirect
  namespace: lab-wiki
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
spec:
  hostnames:
  - wiki.lab.local
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: ledger-private
    namespace: architects-ledger
    sectionName: wiki-https
  rules:
  - backendRefs:
    - group: ''
      kind: Service
      name: lab-wiki
      port: 443
      weight: 1
metadata:
  name: wiki
  namespace: lab-wiki
